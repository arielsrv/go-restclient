sonar.projectKey=arielsrv_go-restclient
sonar.organization=arielsrv
sonar.projectName=go-restclient
sonar.projectVersion=1.0

# Source code
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/mocks/**,**/examples/**,**/*_test.go,**/vendor/**,**/docs/**
# Exclude generated mocks and example programs from BOTH main and test analysis.
sonar.test.exclusions=**/mocks/**,**/examples/**
sonar.coverage.exclusions=**/mocks/**,**/examples/**,**/*_test.go,**/doc.go,**/mockup.go,**/mockup_test.go,**/mockup_timeout_test.go

# Encoding
sonar.sourceEncoding=UTF-8

# Go specific
sonar.go.coverage.reportPaths=coverage.out

# ------------------------------------------------------------------
# Duplication detection (CPD) exclusions
# ------------------------------------------------------------------
# Mockery-generated mocks are inherently repetitive (one block per
# mocked method). Examples follow a didactic pattern (setup boilerplate
# repeats on purpose). Tests use table-driven scaffolding that triggers
# false positives.
sonar.cpd.exclusions=**/mocks/**,**/examples/**,**/*_test.go

# ------------------------------------------------------------------
# Issue exclusions
# ------------------------------------------------------------------
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,t5,t6,t7,t8,t9,t10,api1

# Cognitive complexity is acceptable in table-driven tests.
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go

# Duplicated string literals are expected in tests/examples.
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.t3.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t3.resourceKey=**/examples/**

# Empty benchmark bodies are intentional (warm-up / allocation baselines).
sonar.issue.ignore.multicriteria.t4.ruleKey=go:S108
sonar.issue.ignore.multicriteria.t4.resourceKey=**/*_test.go

# Identical test helpers may legitimately repeat (different scenarios).
sonar.issue.ignore.multicriteria.t5.ruleKey=go:S4144
sonar.issue.ignore.multicriteria.t5.resourceKey=**/*_test.go

# Single-method interface naming conventions: examples are illustrative.
sonar.issue.ignore.multicriteria.t6.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.t6.resourceKey=**/examples/**

# Parameter grouping & expression-in-condition: examples are didactic.
sonar.issue.ignore.multicriteria.t7.ruleKey=godre:S8209
sonar.issue.ignore.multicriteria.t7.resourceKey=**/examples/**
sonar.issue.ignore.multicriteria.t8.ruleKey=godre:S8193
sonar.issue.ignore.multicriteria.t8.resourceKey=**/*_test.go

# Mockery-generated identifiers (_a0, _a1, ...) intentionally violate S117.
sonar.issue.ignore.multicriteria.t9.ruleKey=go:S117
sonar.issue.ignore.multicriteria.t9.resourceKey=**/mocks/**

# Generated mock helper naming.
sonar.issue.ignore.multicriteria.t10.ruleKey=go:S117
sonar.issue.ignore.multicriteria.t10.resourceKey=**/mock_*.go

# Public API: Media is intentionally a noun (composed by MediaMarshaler /
# MediaUnmarshaler); renaming would be a breaking change.
sonar.issue.ignore.multicriteria.api1.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.api1.resourceKey=**/rest_media.go
