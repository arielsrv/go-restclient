name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Pinned to match the Python version used to compile docs/requirements.txt
          # (regenerate with: pip-compile --generate-hashes --strip-extras
          #                                docs/requirements.in)
          python-version: '3.13'

      - name: Install MkDocs and theme
        # --require-hashes forces use of the locked digests in docs/requirements.txt
        # --only-binary :all: prevents arbitrary setup.py execution from sdist tarballs
        # docs/requirements.txt is generated via: pip-compile --generate-hashes docs/requirements.in
        run: "pip install --require-hashes --only-binary :all: -r docs/requirements.txt"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

