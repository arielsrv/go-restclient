# yaml-language-server: $schema=https://json.schemastore.org/taskfile.json
version: '3'

env:
  SOURCE_FOLDER: ./...
  BUILD_FOLDER: build
  COVERAGE_OUT_FILE: coverage.out
  COVERAGE_HTML_FILE: coverage.html

tasks:
  markdown:
    cmds:
      - markdownlint-cli2 "**/*.md" "#vendor"

  audit:
    cmds:
      - go mod verify
      - go vet ./...
      - go tool govulncheck ./...

  lint-tools:
    cmds:
      - go tool golangci-lint run --fix
      - go tool gofumpt -w -l .
      - go tool betteralign -test_files -generated_files -apply ./...

  lint:
    cmds:
      - cd examples
      - task: lint-tools
      - cd ..
      - task: lint-tools

  race:
    cmds:
      - CGO_ENABLED=0 go test -race -count 10 ./...

  test:
    cmds:
      - go test -v ./...

  test:nil:
    cmds:
      - go tool nilaway ./...

  test:report:
    cmds:
      - go tool gotestsum --junitfile report.xml --format testname

  mock:
    cmds:
      - go tool mockery --config .mockery.yaml

  coverage:
    cmds:
      - go test $SOURCE_FOLDER -covermode=count -coverprofile=$COVERAGE_OUT_FILE
      - go tool cover -html $COVERAGE_OUT_FILE -o $COVERAGE_HTML_FILE
      - go tool cover -func=$COVERAGE_OUT_FILE -o=$COVERAGE_OUT_FILE

  coverage:report:
    cmds:
      - CGO_ENABLED=0 go test $SOURCE_FOLDER -coverprofile=coverage-report.out

  clean:
    cmds:
      - rm -rf $COVERAGE_OUT_FILE $COVERAGE_HTML_FILE

  download:
    cmds:
      - go work sync
      - (cd examples && go mod tidy)
      - (cd examples && go build ./...)
      - go mod tidy

  upgrade:
    cmds:
      - go tool go-mod-upgrade

  build:
    cmds:
      - go build ./...

  examples:build:
    dir: examples
    cmds:
      - go build ./...

  examples:run:
    desc: Run every example under ./examples (set EXAMPLE=name to run only one)
    dir: examples
    cmds:
      - |
        set -e
        for dir in */; do
          name="${dir%/}"
          [ -f "$name/main.go" ] || continue
          if [ -n "$EXAMPLE" ] && [ "$EXAMPLE" != "$name" ]; then continue; fi
          echo "=== running example: $name ==="
          go run "./$name" || echo "!!! example '$name' failed (exit $?)"
        done

  release:
    cmds:
      - task: download
      - task: mock
      - task: build
      - task: lint
      - task: test
      - task: race

  default:
    cmds:
      - task: release
